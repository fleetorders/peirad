<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="dokimd — a manifest card and a harness card flanking a live vitals reading, an integration checked and proven to hold">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a3a"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ec7a6"/>
      <stop offset="0.5" stop-color="#7ff0d4"/>
      <stop offset="1" stop-color="#2ec7a6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="640" height="300" rx="18"/></clipPath>
    <clipPath id="dial"><circle cx="320" cy="150" r="48"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="300" fill="url(#bg)"/>

    <!-- LEFT card: the dokimd.json manifest (what to check) -->
    <g>
      <rect x="48" y="82" width="158" height="136" rx="12" fill="#232f3e" stroke="#33455a" stroke-width="2"/>
      <rect x="66" y="102" width="54" height="11" rx="5.5" fill="#3a4d63"/>
      <rect x="66" y="130" width="114" height="8" rx="4" fill="#46596f"/>
      <rect x="66" y="151" width="98" height="8" rx="4" fill="#46596f"/>
      <rect x="66" y="173" width="106" height="8" rx="4" fill="#46596f"/>
      <rect x="66" y="192" width="46" height="17" rx="6" fill="#33455a"/>
    </g>

    <!-- RIGHT card: the live harness, with one line verified (teal) -->
    <g>
      <rect x="434" y="82" width="158" height="136" rx="12" fill="#232f3e" stroke="#33455a" stroke-width="2"/>
      <rect x="452" y="102" width="54" height="11" rx="5.5" fill="#3a4d63"/>
      <rect x="452" y="130" width="110" height="8" rx="4" fill="#46596f"/>
      <rect x="448" y="146" width="130" height="17" rx="6" fill="#173b34" stroke="#2ec7a6" stroke-width="2"/>
      <rect x="456" y="151.5" width="92" height="6" rx="3" fill="#2ec7a6"/>
      <rect x="452" y="176" width="100" height="8" rx="4" fill="#46596f"/>
      <rect x="452" y="192" width="46" height="17" rx="6" fill="#33455a"/>
    </g>

    <!-- CENTRE: the live vitals reading — checked, and still beating -->
    <circle cx="320" cy="150" r="48" fill="#182430" stroke="#33455a" stroke-width="2"/>
    <g clip-path="url(#dial)">
      <path d="M 276 150 H 302 l 6 -6 l 6 13 l 10 -31 l 10 47 l 8 -23 l 6 0 H 364"
            fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="320" cy="150" r="48" fill="none" stroke="url(#accent)" stroke-width="9"/>
  </g>
  <rect x="1" y="1" width="638" height="298" rx="18" fill="none" stroke="#2b3a4d" stroke-width="2"/>
</svg>
